name: Build Docker candidate
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      source_ref:
        type: string
        required: true
      verify_only:
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
      - id: identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "stamp=$(TZ=UTC git show -s --date=format-local:%Y%m%d%H%M --format=%cd HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "channel=$([ -n "$VERSION" ] && echo release || echo nightly)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ !inputs.verify_only }}
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.verify_only }}
          tags: ${{ secrets.DOCKER_HUB_USERNAME || 'boybook' }}/tx-5dr:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            BUILD_DATE=${{ steps.identity.outputs.date }}
            BUILD_STAMP=${{ steps.identity.outputs.stamp }}
            VCS_REF=${{ inputs.source_ref }}
            TX5DR_BUILD_CHANNEL=${{ steps.identity.outputs.channel }}
            TX5DR_RELEASE_VERSION=${{ inputs.version }}
            TX5DR_CLUBLOG_API_KEY=${{ secrets.CLUBLOG_API_KEY }}
      - name: Smoke both image architectures
        if: ${{ !inputs.verify_only }}
        env:
          IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/tx-5dr@${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            container=$(docker run -d --platform "linux/$arch" "$IMAGE")
            trap 'docker rm -f "$container" >/dev/null' EXIT
            healthy=false
            for attempt in $(seq 1 45); do
              if docker exec "$container" node -e 'fetch("http://127.0.0.1:4000/api/hello").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then healthy=true; break; fi
              sleep 2
            done
            if [[ "$healthy" != true ]]; then docker logs "$container"; exit 1; fi
            docker exec -e EXPECTED_SHA="$SOURCE_SHA" "$container" node -e 'const info=require("/app/packages/server/dist/generated/buildInfo.json"); if(info.commit!==process.env.EXPECTED_SHA) process.exit(1)'
            docker stop -t 45 "$container"
            docker rm "$container"
            trap - EXIT
          done
      - name: Record immutable image identity
        if: ${{ !inputs.verify_only }}
        env:
          IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/tx-5dr
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p docker-artifact
          node -e 'require("fs").writeFileSync("docker-artifact/docker.json", JSON.stringify({image:process.env.IMAGE,digest:process.env.DIGEST}))'
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.verify_only }}
        with:
          name: tx5dr-docker
          path: docker-artifact/docker.json
