name: Verify and release TX-5DR
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing commit or vX.Y.Z tag (empty uses selected ref)
        type: string
        default: ''
      publish:
        description: Publish validated main/nightly or an existing release tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tx5dr-release-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
      - id: identity
        env:
          REQUEST_REF: ${{ inputs.ref || github.ref }}
          PUBLISH_REQUEST: ${{ github.event_name == 'push' || inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/resolve-release-identity.mjs >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev libudev-dev libusb-1.0-0-dev portaudio19-dev
      - run: corepack enable && yarn install --immutable
      - run: yarn check:versions && yarn check:i18n
      - run: yarn build
      - run: yarn lint
      - run: yarn test --concurrency=1
      - run: node --test scripts/tests/release-policy.test.mjs
  electron:
    needs: verify
    uses: ./.github/workflows/electron-release.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      source_ref: ${{ needs.verify.outputs.sha }}
      verify_only: ${{ needs.verify.outputs.publish != 'true' }}
    secrets: inherit
  server:
    needs: verify
    uses: ./.github/workflows/server-release.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      source_ref: ${{ needs.verify.outputs.sha }}
      verify_only: ${{ needs.verify.outputs.publish != 'true' }}
    secrets: inherit
  android:
    needs: verify
    uses: ./.github/workflows/android-runtime-release.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      source_ref: ${{ needs.verify.outputs.sha }}
      verify_only: ${{ needs.verify.outputs.publish != 'true' }}
    secrets: inherit
  docker:
    needs: verify
    uses: ./.github/workflows/docker-release.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      source_ref: ${{ needs.verify.outputs.sha }}
      verify_only: ${{ needs.verify.outputs.publish != 'true' }}
    secrets: inherit
  publish:
    needs: [verify, electron, server, android, docker]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: tx5dr-channel-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.1'
      - uses: actions/download-artifact@v4
        with:
          path: release-inputs
      - run: bash scripts/install-ossutil.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Verify and publish all products
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BASE_URL: ${{ secrets.OSS_BASE_URL }}
        run: node scripts/publish-release.mjs
