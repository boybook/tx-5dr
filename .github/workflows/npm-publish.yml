name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Enable npm Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate version sources
        run: yarn check:versions

      - name: Validate release surface
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const version = String(process.env.VERSION || '');
          const match = /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(version);
          if (!match) throw new Error(`Invalid publish version: ${version}`);
          const packageDirs = [
            'packages/contracts',
            'packages/core',
            'packages/plugin-api',
            'packages/create-tx5dr-plugin',
          ];
          for (const packageDir of packageDirs) {
            const manifest = JSON.parse(fs.readFileSync(`${packageDir}/package.json`, 'utf8'));
            if (manifest.version !== version) {
              throw new Error(
                `${manifest.name} source version is ${manifest.version}; expected committed ${version}`,
              );
            }
          }
          const supportsStableContest = Number(match[1]) > 2
            || (Number(match[1]) === 2 && Number(match[2]) >= 1);
          const pluginApi = JSON.parse(fs.readFileSync('packages/plugin-api/package.json', 'utf8'));
          if (pluginApi.exports?.['./contest'] && !supportsStableContest) {
            throw new Error(
              'The stable @tx5dr/plugin-api/contest surface requires version 2.1.0 or newer. '
              + 'Publish 2.0.1 containment from the pre-Contest-SDK baseline.',
            );
          }
          EOF

      - name: Prepare registry dependency manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Preparing workspace dependencies for SDK train $VERSION"
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const version = process.env.VERSION;
          const packageDirs = [
            'packages/contracts',
            'packages/core',
            'packages/plugin-api',
            'packages/create-tx5dr-plugin',
          ];
          const publishedVersions = new Map([
            ['@tx5dr/contracts', version],
            ['@tx5dr/core', version],
            ['@tx5dr/plugin-api', version],
            ['create-tx5dr-plugin', version],
          ]);

          for (const packageDir of packageDirs) {
            const packageJsonPath = path.join(packageDir, 'package.json');
            const pkg = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
            for (const field of ['dependencies', 'peerDependencies', 'optionalDependencies']) {
              if (!pkg[field]) continue;
              for (const [name, resolvedVersion] of publishedVersions.entries()) {
                if (typeof pkg[field][name] === 'string' && pkg[field][name].startsWith('workspace:')) {
                  pkg[field][name] = resolvedVersion;
                }
              }
            }

            if (pkg.devDependencies) {
              for (const [name, spec] of Object.entries(pkg.devDependencies)) {
                if (typeof spec === 'string' && spec.startsWith('workspace:')) {
                  delete pkg.devDependencies[name];
                }
              }
              if (Object.keys(pkg.devDependencies).length === 0) {
                delete pkg.devDependencies;
              }
            }

            fs.writeFileSync(packageJsonPath, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          EOF

      - name: Build packages
        run: |
          yarn workspace @tx5dr/contracts build
          yarn workspace @tx5dr/core build
          yarn workspace @tx5dr/plugin-api build
          yarn workspace create-tx5dr-plugin build

      - name: Lint plugin API
        run: yarn workspace @tx5dr/plugin-api lint

      - name: Run tests
        run: |
          yarn workspace @tx5dr/plugin-api test
          yarn workspace create-tx5dr-plugin smoke:ft8-contest

      - name: Verify packed plugin API exports
        run: yarn workspace @tx5dr/plugin-api smoke:pack

      - name: Publish @tx5dr/contracts
        run: |
          cd packages/contracts
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm pack --dry-run
            echo "DRY RUN: would publish @tx5dr/contracts@${{ inputs.version }}"
          else
            npm publish --access public
          fi

      - name: Publish @tx5dr/core
        run: |
          cd packages/core
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm pack --dry-run
            echo "DRY RUN: would publish @tx5dr/core@${{ inputs.version }}"
          else
            npm publish --access public
          fi

      - name: Publish @tx5dr/plugin-api
        run: |
          cd packages/plugin-api
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm pack --dry-run
            echo "DRY RUN: would publish @tx5dr/plugin-api@${{ inputs.version }}"
          else
            npm publish --access public
          fi

      - name: Publish create-tx5dr-plugin
        run: |
          cd packages/create-tx5dr-plugin
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm pack --dry-run
            echo "DRY RUN: would publish create-tx5dr-plugin@${{ inputs.version }}"
          else
            npm publish --access public
          fi

      - name: Create git tag
        if: inputs.dry_run == false
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "contracts-v${VERSION}"
          git push origin "contracts-v${VERSION}"
          git tag "core-v${VERSION}"
          git push origin "core-v${VERSION}"
          git tag "plugin-api-v${VERSION}"
          git push origin "plugin-api-v${VERSION}"
          git tag "create-tx5dr-plugin-v${VERSION}"
          git push origin "create-tx5dr-plugin-v${VERSION}"
