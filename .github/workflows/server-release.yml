name: Build and Release Linux Server

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      source_ref:
        type: string
        required: true
      verify_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-server-linux:
    name: Build Server Package (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            artifact_name: tx5dr-server-linux-amd64

          - os: ubuntu-24.04-arm
            arch: arm64
            artifact_name: tx5dr-server-linux-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 20

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libpulse-dev \
            libhamlib-dev libhamlib4 \
            libopus-dev \
            build-essential python3-dev pkg-config \
            ruby-dev rpm

      - name: Install fpm
        run: sudo gem install fpm --no-document

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prepare server build metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          yarn check:versions
          COMMIT_STAMP=$(node scripts/host-version.mjs --build-stamp-of "${{ inputs.source_ref }}")
          if [ -z "$RELEASE_VERSION" ]; then
            node scripts/prepare-server-build-info.mjs \
              --channel nightly \
              --commit "${{ inputs.source_ref }}" \
              --build-stamp "$COMMIT_STAMP" \
              --distribution linux-service
          else
            node scripts/prepare-server-build-info.mjs \
              --channel release \
              --version "${RELEASE_VERSION#v}" \
              --commit "${{ inputs.source_ref }}" \
              --build-stamp "$COMMIT_STAMP" \
              --distribution linux-service
          fi

      - name: Build application
        run: yarn build
        env:
          NODE_ENV: production
          TX5DR_CLUBLOG_API_KEY: ${{ secrets.CLUBLOG_API_KEY }}

      - name: Build server packages (deb + rpm)
        run: scripts/package-linux.sh both --no-build
        env:
          TX5DR_DOWNLOAD_BASE_URL: ${{ secrets.OSS_BASE_URL }}

      - name: Verify packaged server and Image Radio runtime
        shell: bash
        run: |
          set -euo pipefail
          DEB_FILE=$(find dist -name '*.deb' -type f | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "Server DEB package not found" >&2
            exit 1
          fi
          EXTRACT_DIR=$(mktemp -d)
          trap 'rm -rf "$EXTRACT_DIR"' EXIT
          dpkg-deb -x "$DEB_FILE" "$EXTRACT_DIR"
          APP_ROOT="$EXTRACT_DIR/usr/share/tx5dr"
          export NODE_PATH="$APP_ROOT/node_modules"
          SOURCE_SHA="${{ inputs.source_ref }}" node scripts/smoke-packaged-server.mjs "$APP_ROOT"

      - name: Prepare artifacts
        run: |
          VERSION="${{ inputs.version }}"
          ARCH="${{ matrix.arch }}"
          mkdir -p release-artifacts

          if [ -z "$VERSION" ]; then
            PREFIX="TX-5DR-nightly"
          else
            PREFIX="TX-5DR-${VERSION}"
          fi

          find dist/ -name "*.deb" -type f | while read -r f; do
            cp "$f" "release-artifacts/${PREFIX}-server-linux-${ARCH}.deb"
            echo "✅ deb: ${PREFIX}-server-linux-${ARCH}.deb"
          done

          find dist/ -name "*.rpm" -type f | while read -r f; do
            cp "$f" "release-artifacts/${PREFIX}-server-linux-${ARCH}.rpm"
            echo "✅ rpm: ${PREFIX}-server-linux-${ARCH}.rpm"
          done

          ls -lh release-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-artifacts/*
          retention-days: 30
